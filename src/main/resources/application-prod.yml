spring:
  application:
    name: spring-boot-docker

  profiles:
    active: prod

  management:
    server:
      port: 8081

    endpoints:
      web:
        exposure:
          include: health,info

    endpoint:
      health:
        show-details: always
        probes:
          enabled: true

    health:
      livenessstate:
        enabled: true
      readinessstate:
        enabled: true

  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  file:
    path: ${user.home}/ApplicationLog
#    path: /app/log


  level:
    root: INFO

