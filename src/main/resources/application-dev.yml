spring:
  application:
    name: spring-boot-docker
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  file:
    path: ${user.home}/ApplicationLog

  level:
    root: DEBUG